name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # version comes from package.json "packageManager"
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc -b --noEmit
      - run: pnpm test
      - run: pnpm build

  # no deploy job here — Vercel's own GitHub integration deploys every push to main
  # automatically once the repo is connected there (see deploy/DEPLOYMENT.md)
